<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuroscience Blog Platform</title>
  <meta name="description" content="一個神經科的閱讀與思考現場——文獻心得、臨床筆記與照片。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mn-wrap">
    <h1 class="mn-hd">Neuroscience Blog Platform</h1>

    <div class="mn-grid">
      <!-- 側欄 -->
      <aside>
        <div class="mn-navlabel">Navigation</div>
        <nav id="nav"></nav>
        <div id="links"></div>
      </aside>

      <!-- 主面板（由 app.js 填入 feed 或 detail） -->
      <main id="panel" class="mn-panel"></main>
    </div>

    <!-- 分析列 -->
    <div class="mn-stats">
      <div class="mn-stat">
        <div class="lbl">Total Views</div>
        <div class="val" id="views">—</div>
      </div>
      <div class="mn-divider"></div>
      <div class="mn-stat cat">
        <div class="lbl">Category</div>
        <div class="val" id="catlabel">All</div>
      </div>
    </div>

    <footer class="mn-foot">
      <span>Neuroscience Blog Platform</span>
      <span id="foot-views"></span>
    </footer>
  </div>

  <!-- 內容與設定 -->
  <script src="posts.js"></script>
  <script src="app.js"></script>
</body>
</html>
